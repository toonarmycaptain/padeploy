[project]
name = "padeploy"
version = "0.0.2"
description = "Deploy and manage PythonAnywhere web apps from your project repo"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "toonarmycaptain" }
]
requires-python = ">=3.13"
dependencies = [
    "click>=8.5.0",
    "requests>=2.34.2",
]

[project.scripts]
padeploy = "padeploy.cli:main"

[build-system]
requires = ["uv_build>=0.9.0,<0.10.0"]
build-backend = "uv_build"

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
    "types-requests>=2.33.0.20260906",
]
