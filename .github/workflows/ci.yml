name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy

  test:
    runs-on: ubuntu-latest
    # Pre-release Python: failures show on the job but don't fail the run.
    continue-on-error: ${{ startsWith(matrix.python-version, '3.16') }}
    strategy:
      matrix:
        python-version: ["3.13", "3.14", "3.15", "3.16", "3.14t", "3.15t", "3.16t"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv run pytest
      # A dependency's compiled module could turn the GIL back on, and the tests would still pass.
      - name: Check the GIL stays off
        if: endsWith(matrix.python-version, 't')
        run: uv run python -W error::RuntimeWarning -c "import sys, padeploy.cli; assert not sys._is_gil_enabled()"

  # Release PRs must bump the version past the latest one on PyPI and have a CHANGELOG.md entry for it.
  version-bump:
    if: github.base_ref == 'publish'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Check version is newer than PyPI
        run: |
          version=$(uv version --short)
          latest=$(curl -fsS https://pypi.org/pypi/padeploy/json | jq -r .info.version) || latest=0
          echo "pyproject: $version, PyPI: $latest"
          uv run --no-project --with packaging python -c '
          import sys
          from packaging.version import Version
          new, old = sys.argv[1:]
          if Version(new) <= Version(old):
              sys.exit(f"Version {new} is not newer than PyPI {old}. Run: uv version --bump patch|minor|major")
          ' "$version" "$latest"
      - name: Check CHANGELOG.md has an entry for this version
        run: |
          version=$(uv version --short)
          if ! grep -qF "## [$version]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$version]' section. Rename [Unreleased] to it."
            exit 1
          fi
